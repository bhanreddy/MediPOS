name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: ./backend

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: './backend/package-lock.json'

      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: Unit & Route Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      NODE_ENV: test
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_JWT_SECRET: test-jwt-secret-at-least-32-chars-long
      ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: './backend/package-lock.json'

      - run: npm ci
      - run: npm test -- --runInBand

  postgres-integration:
    name: PostgreSQL Transactions & Durability
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medical_ci_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/medical_ci_qa
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/medical_ci_qa
      LOCAL_DB_PATH: /tmp/medical-ci-qa.db
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_JWT_SECRET: test-jwt-secret-at-least-32-chars-long
      ALLOWED_ORIGINS: http://localhost:8082
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: './backend/package-lock.json'
      - run: npm ci
      - run: npm run build
      - run: node scripts/setup-qa.cjs
      - run: npm test -- --runInBand --runTestsByPath src/__tests__/integration/cloudWrites.pg.test.ts src/__tests__/integration/billingPerformance.pg.test.ts
      - run: node scripts/test-durable-runtime.cjs

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, postgres-integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy
        run: railway up --service medical-pos-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
